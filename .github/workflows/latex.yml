name: Compile LaTeX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - name: Prepare Pages
        run: |
          mkdir -p public
          cp main.pdf public/document.pdf

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>My LaTeX Document</title>
              <style>
                  body {
                      margin: 0;
                      padding: 0;
                      background: #f5f5f5;
                      font-family: sans-serif;
                  }
                  iframe {
                      width: 100%;
                      height: 100vh;
                      border: none;
                  }
              </style>
          </head>
          <body>
              <iframe src="document.pdf"></iframe>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
