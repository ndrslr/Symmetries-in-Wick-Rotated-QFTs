name: Compile LaTeX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - name: Prepare Pages
        run: |
          mkdir -p public
          cp main.pdf public/document.pdf

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Symmetries in Wick-Rotated QFTs</title>
              <style>
                  body {
                      margin: 0;
                      padding: 40px 20px;
                      background: #f5f5f5;
                      font-family: sans-serif;
                      text-align: center;
                  }

                  h1 {
                      font-size: 24px;
                  }

                  a {
                      display: inline-block;
                      margin-top: 20px;
                      padding: 12px 20px;
                      background: #0366d6;
                      color: white;
                      text-decoration: none;
                      border-radius: 6px;
                  }

                  a:hover {
                      background: #0256b3;
                  }
              </style>
          </head>
          <body>
              <h1>Symmetries in Wick-Rotated QFTs</h1>

              <p>Lecture notes</p>

              <a href="document.pdf">
                  Open PDF
              </a>
          </body>
          </html>
          EOF


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
